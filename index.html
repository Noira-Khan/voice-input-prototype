<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiet Push-to-Talk: Voice Input Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--ink:#241a4d;--mute:#6b6586;--indigo:#2d2060;--teal:#1e8c7a;--amber:#f2b035;--coral:#f56338;--lav:#f0edf8;--card:#fff;--line:#ddd7ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112b;--ink:#efeafc;--mute:#a9a2c9;--card:#201a40;--line:#3a3166}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:420px;margin:0 auto;padding:24px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:12px}
.restart{font:inherit;font-size:.78rem;background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;padding:4px 8px}
.phone.buzz{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.mic.pulse{animation:micpulse .6s 2}
@keyframes micpulse{50%{box-shadow:0 0 0 12px rgba(30,140,122,.28)}}
h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.main{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:32px;align-items:start}
@media(max-width:760px){.main{grid-template-columns:1fr}}
.phone{width:100%;max-width:360px;height:660px;margin:0 auto;background:#fff;border:10px solid var(--indigo);border-radius:38px;position:relative;overflow:hidden;color:#241a4d;display:flex;flex-direction:column}
.status{font-size:.78rem;padding:8px 18px 0;display:flex;justify-content:space-between;color:#241a4d}
.hdr{padding:6px 16px;font-weight:800;color:var(--indigo);font-size:1rem}
.body{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.empty{background:var(--lav);border-radius:16px;padding:14px;font-size:.9rem;color:#4b4370}
.bub{max-width:85%;padding:10px 13px;border-radius:16px;font-size:.88rem}
.me{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--lav);border-bottom-left-radius:4px}
.nudge{align-self:flex-end;background:var(--indigo);color:#fff;border-radius:14px;padding:9px 12px;font-size:.82rem;cursor:pointer;border:0;text-align:left;font-family:inherit;animation:pop .25s}
.nudge b{color:var(--amber);font-weight:600}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.bar{display:flex;gap:8px;padding:8px 12px 14px;align-items:center}
.bar input{flex:1;border:1.5px solid var(--line);border-radius:99px;padding:10px 14px;font:inherit;font-size:.88rem;min-width:0;color:#241a4d;background:#fff}
.mic{width:42px;height:42px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:1.1rem;cursor:pointer;touch-action:none;user-select:none;flex:none}
.mic:focus-visible,.send:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.rec{flex:1;margin:10px 14px;background:var(--lav);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.dim{width:100%;background:#e0dcee;border-radius:12px;padding:10px 12px;font-size:.85rem;color:#a39cbd;min-height:56px;filter:blur(.6px)}
.big{width:96px;height:96px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-size:2.2rem;color:#fff;box-shadow:0 0 0 8px rgba(30,140,122,.18);animation:breathe 1.4s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 16px rgba(30,140,122,.08)}}
.wave{display:flex;gap:4px;align-items:center;height:36px}
.wave i{width:6px;background:var(--amber);border-radius:2px;height:8px;transition:height .12s}
.hint{font-size:.8rem;color:#6b6586}
.rev{flex:1;display:flex;flex-direction:column;padding:6px 14px 12px;gap:12px}
.rev textarea{flex:1;max-height:230px;border:1.5px solid var(--line);border-radius:16px;background:var(--lav);padding:12px;font:inherit;font-size:.92rem;color:#241a4d;resize:none}
.send{background:var(--teal);color:#fff;border:0;border-radius:99px;padding:13px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.toast{position:absolute;left:14px;right:14px;bottom:76px;background:var(--indigo);color:#fff;border-radius:14px;padding:11px 14px;font-size:.84rem;animation:pop .3s}
.toast em{color:var(--amber);font-style:normal}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <button class="restart" onclick="reset()">Restart</button>
</div>
<script>
var PROMPT="Explain compound interest with an example in simple Hindi for my brother";
var S={scr:"chat",typed:"",nudge:false,words:[],text:"",streak:1,msgs:[],toast:false,step:0,typing:null,held:false,t0:0,iv:null};
var AIREPLY="Compound interest ka matlab hai byaaj par bhi byaaj. Maan lo tum \u20B910,000 ek saal ke liye 10% par rakhte ho: pehle saal ke baad \u20B911,000 ho jaate hain. Doosre saal 10% \u20B911,000 par lagta hai, yaani \u20B91,100, aur total \u20B912,100 ho jaata hai. Simple interest mein sirf \u20B912,000 hote.";
function $(i){return document.getElementById(i)}
function buzz(){var p=$("phone");if(p){p.classList.remove("buzz");void p.offsetWidth;p.classList.add("buzz")}try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}var v=$("vib");if(v){v.classList.add("on");setTimeout(function(){v.classList.remove("on")},350)}}
function mask(a){return a.map(function(w){return "\u2022".repeat(Math.max(2,Math.min(w.length,7)))}).join(" ")}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
  var h='<div class="status"><span>9:41</span><span>5G</span></div>';
  if(S.scr==="chat"){
    h+='<div class="hdr">ChatGPT</div><div class="body" id="body">';
    if(!S.msgs.length&&!S.typed)h+='<div class="empty">Ask anything</div>';
    S.msgs.forEach(function(m){h+='<div class="bub '+m.w+'">'+esc(m.t)+'</div>'});
    if(S.nudge)h+='<button class="nudge" onclick="tryMic()">Long message? Hold the mic and say it. <b>You\u2019ll review before it sends.</b></button>';
    h+='</div>';
    if(S.toast)h+='<div class="toast">Voice worked.<br><em>Try it again next time.</em><br>\u2B50 '+S.streak+'-day voice streak</div>';
    h+='<div class="bar"><input id="inp" placeholder="Type a message..." value="'+esc(S.typed)+'" oninput="onInp(this.value)"><button class="mic" id="mic" aria-label="Hold to speak">\uD83C\uDF99</button></div>';
  }else if(S.scr==="rec"){
    h+='<div class="hint" style="padding:4px 18px">Hold to talk</div><div class="rec"><div class="dim" id="dim">'+mask(S.words)+'</div><div class="big">\uD83C\uDF99</div><div class="wave" id="wave">'+'<i></i>'.repeat(9)+'</div><div class="hint">Release to send \u00b7 Slide up to cancel</div></div><div style="padding:0 18px 20px"></div>';
  }else{
    h+='<div class="hdr">Review before sending</div><div class="rev"><textarea id="ta" aria-label="Transcript">'+esc(S.text)+'</textarea><button class="send" onclick="send()">Send</button><div class="hint">Edit anything before you send.</div></div>';
  }
  $("phone").innerHTML=h;
  var mic=$("mic");if(mic){mic.onpointerdown=startRec;}
}
function onInp(v){S.typed=v;S.step=v?0:S.step;if(v.length>25&&!S.nudge){S.nudge=true;S.step=1;render();var i=$("inp");i.focus();i.setSelectionRange(v.length,v.length)}}
function tryMic(){var m=$("mic");if(m){m.classList.remove("pulse");void m.offsetWidth;m.classList.add("pulse");setTimeout(function(){m.classList.remove("pulse")},1300)}}
function startRec(e){
  e.preventDefault();clearInterval(S.typing);S.typing=null;
  S.scr="rec";S.words=[];S.step=2;S.t0=Date.now();S.held=true;S.y0=e.clientY;buzz();render();
  var all=PROMPT.split(" ");
  S.iv=setInterval(function(){
    S.step=3;
    if(S.words.length<all.length)S.words.push(all[S.words.length]);
    var d=$("dim");if(d)d.textContent=mask(S.words);
    var w=$("wave");if(w)Array.prototype.forEach.call(w.children,function(b){b.style.height=(6+Math.random()*(S.words.length<all.length?22:4))+"px"});
  },260);
  document.addEventListener("pointerup",stopRec,{once:true});
  document.addEventListener("pointercancel",stopRec,{once:true});
}
function stopRec(e){
  if(!S.held)return;S.held=false;clearInterval(S.iv);buzz();
  if(e&&e.clientY!==undefined&&S.y0-e.clientY>60){S.scr="chat";S.words=[];S.step=0;render();return}
  if(S.words.length<3){S.scr="chat";S.nudge=true;S.step=1;render();tryMic();return}
  S.text=S.words.join(" ");S.scr="review";S.step=4;render();
}
function send(){
  var t=$("ta").value.trim();if(!t)return;
  S.msgs=[{w:"me",t:t},{w:"ai",t:AIREPLY}];S.typed="";S.nudge=false;S.scr="chat";S.step=5;S.toast=true;render();
  setTimeout(function(){S.toast=false;if(S.scr==="chat")render()},5000);
}
function reset(){clearInterval(S.iv);clearInterval(S.typing);S={scr:"chat",typed:"",nudge:false,words:[],text:"",streak:2,msgs:[],toast:false,step:0,typing:null,held:false,t0:0,iv:null};render()}
render();
</script>
</body>
</html>
